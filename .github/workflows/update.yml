name: Rebuild and publish film lists

on:
  push:
    branches: [main, master]
    paths:
      - 'build.js'
      - 'data/india.json'
      - 'docs/index.html'
      - 'docs/assets/**'
      - 'docs/logo.png'
      - 'docs/background.png'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '23 18 * * 0'  # Sunday UTC, Monday morning in Melbourne during daylight saving
  workflow_dispatch:

# The site is published directly from the built artifact. No bot commit/push is required.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-updates
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static IMDb catalogues
        run: node build.js
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
